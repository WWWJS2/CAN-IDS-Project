name: Import CAN IDS project
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand project source
        shell: bash
        run: |
          if [ ! -f import/part000.b64 ]; then
            echo "Project source already imported."
            exit 0
          fi
          cat import/part*.b64 | base64 --decode > /tmp/can_ids_source.zip
          unzip -tq /tmp/can_ids_source.zip
          unzip -oq /tmp/can_ids_source.zip -d .
          rm -rf import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import React frontend, FastAPI backend, models and research results"
          git push origin HEAD:main
